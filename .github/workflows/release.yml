name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.0.0"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify firmware checksum
        run: grep -q "$(sha256sum release/*.uf2 | cut -d' ' -f1)" release/RELEASE_NOTES.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "Carnival TKL v5 · 屏幕开关 + 屏幕/灯光自动休眠"
          body_path: release/RELEASE_NOTES.md
          files: release/*.uf2
